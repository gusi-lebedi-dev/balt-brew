server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;
    charset utf-8;
    client_max_body_size 100M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Static theme views must work before WordPress pretty permalinks are configured.
    location = /news/ {
        rewrite ^ /index.php?balt_brew_view=news last;
    }

    location = /age-gate/ {
        rewrite ^ /index.php?balt_brew_view=age-gate last;
    }

    location = /.env.php {
        deny all;
    }

    location = /wp-config.php {
        deny all;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?|mp4|pdf)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location ~* /(?:readme\.html|license\.txt)$ {
        deny all;
    }
}
